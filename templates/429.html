<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 Too Many Requests - Rate Limit Exceeded</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #F0F7FE;
            color: #334155;
        }
        .sky-card {
            background: #FFFFFF;
            border: 1px solid #E0F2FE;
            box-shadow: 0 10px 30px -4px rgba(2, 132, 199, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="max-w-md w-full sky-card rounded-3xl p-8 sm:p-10 text-center space-y-6">
        
        <div class="w-18 h-18 mx-auto rounded-3xl bg-amber-50 border border-amber-200 flex items-center justify-center text-amber-600 shadow-inner">
            <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>

        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-black tracking-wider uppercase bg-amber-100 text-amber-800 border border-amber-200">
                Rate Limit Protection • 429
            </span>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Too Many Requests</h1>
            <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">
                {{ message or "To protect your account against automated attacks and brute-force attempts, requests are temporarily throttled. Please wait 60 seconds before trying again." }}
            </p>
        </div>

        <div class="pt-2">
            <a href="javascript:location.reload()" class="inline-block px-6 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs shadow-sm shadow-sky-600/25 transition">
                Refresh & Try Again
            </a>
        </div>

    </div>
</body>
</html>
