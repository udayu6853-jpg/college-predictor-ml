<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Encountered an Issue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #F0F7FE; }
        .sky-card {
            background: #FFFFFF;
            border: 1px solid #E0F2FE;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.04), 0 8px 18px -2px rgba(2, 132, 199, 0.08), 0 20px 34px -4px rgba(2, 132, 199, 0.10), inset 0 1.5px 0 rgba(255, 255, 255, 0.95), inset 0 -3px 0 rgba(186, 230, 253, 0.50);
            transform: perspective(1000px) translateZ(0);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="max-w-md w-full sky-card rounded-3xl p-8 sm:p-10 text-center space-y-5">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-50 border border-amber-200 flex items-center justify-center text-amber-600">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <div class="space-y-1">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-black uppercase bg-amber-100 text-amber-800">500 Server Error</span>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Internal Server Error</h1>
            <p class="text-xs text-slate-500">An unexpected system error occurred. Details have been securely recorded in the internal server logs for the System Administrator.</p>
        </div>
        <div class="pt-2 flex items-center justify-center gap-3">
            <a href="{{ url_for('dashboard' if session.get('user_id') else 'login') }}" class="px-6 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs shadow-sm transition">
                Return to Dashboard
            </a>
            <a href="{{ url_for('admin_contact') }}" class="px-5 py-2.5 rounded-xl border border-sky-200 bg-white hover:bg-sky-50 text-slate-700 font-semibold text-xs transition">
                Contact Admin
            </a>
        </div>
    </div>
</body>
</html>
