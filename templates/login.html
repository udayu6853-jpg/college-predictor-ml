<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart College Predictor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        skyCanvas: '#F0F7FE',
                        skyPrimary: '#0284C7',
                        skyAccent: '#0EA5E9',
                        skyTint: '#E0F2FE',
                        skyBorder: '#BAE6FD',
                        navyText: '#0F172A'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-dark-saas.css') }}">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F0F7FE;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(14, 165, 233, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 25%, rgba(2, 132, 199, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(56, 189, 248, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-800 antialiased">

    <!-- Ambient glowing light halos -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-sky-400/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-cyan-400/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Login Glass Card -->
    <div class="w-full max-w-md bg-white rounded-3xl border border-sky-100 shadow-xl shadow-sky-500/10 p-8 sm:p-10 relative z-10 space-y-6">
        
        <!-- Brand Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500 to-sky-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/25 mx-auto ring-4 ring-sky-50">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L14.2 8.8L21 11L14.2 13.2L12 20L9.8 13.2L3 11L9.8 8.8L12 2Z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
                <p class="text-xs text-slate-500 mt-1">Sign in to Smart College Predictor</p>
            </div>
        </div>

        {% if error %}
        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold text-left flex items-start gap-2.5">
            <svg class="w-4 h-4 text-rose-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Email & Password Form -->
        <form method="POST" action="{{ url_for('login') }}" class="space-y-4 text-left">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Email Box -->
            <div class="space-y-1">
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700">Email Address</label>
                <div class="relative">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="e.g. student@gmail.com"
                        autocomplete="email"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-sky-200 bg-sky-50/20 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 text-sm font-semibold transition"
                    >
                </div>
            </div>

            <!-- Password Box -->
            <div class="space-y-1">
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700">Password</label>
                </div>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-sky-200 bg-sky-50/20 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 text-sm font-semibold transition pr-10"
                    >
                    <button
                        type="button"
                        onclick="togglePasswordVisibility()"
                        class="absolute right-3 top-3.5 text-slate-400 hover:text-sky-600 focus:outline-none cursor-pointer"
                        title="Toggle password view"
                    >
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Sign In Submit Button -->
            <button
                type="submit"
                class="w-full py-3.5 px-5 rounded-xl bg-gradient-to-r from-sky-600 to-sky-500 hover:from-sky-700 hover:to-sky-600 text-white font-extrabold text-sm shadow-md shadow-sky-600/25 active:scale-95 transition flex items-center justify-center gap-2 cursor-pointer mt-2"
            >
                <span>Sign In</span>
                <span>→</span>
            </button>
        </form>

        <!-- "or" Divider -->
        <div class="relative flex items-center justify-center my-3">
            <div class="border-t border-sky-100 w-full"></div>
            <span class="bg-white px-3 text-xs font-bold text-slate-400 uppercase tracking-wider">or</span>
            <div class="border-t border-sky-100 w-full"></div>
        </div>

        <!-- Google OAuth Button -->
        <a href="{{ url_for('google_login') }}"
           id="googleLoginLink"
           onclick="handleGoogleOAuth(event)"
           class="w-full flex items-center justify-center gap-3 px-5 py-3 rounded-xl border border-sky-200 bg-white hover:bg-sky-50/70 text-slate-800 font-bold text-sm shadow-xs transition-all duration-200 hover:border-sky-400 hover:shadow-sm transform hover:-translate-y-0.5">
            <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.92-4.18 2.92-7.42z"/>
                <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.5z"/>
                <path fill="#FBBC05" d="M6.54 13.58A5.86 5.86 0 0 1 6.23 12c0-.55.1-1.08.31-1.58V7.89H3.3A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.11l3.24-2.53z"/>
                <path fill="#EA4335" d="M12 6.39c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.39 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.7 5.39l3.24 2.53C7.31 8.11 9.46 6.39 12 6.39z"/>
            </svg>
            <span>Continue with Google</span>
        </a>

        <!-- Sign Up Link -->
        <div class="pt-2 text-center text-xs text-slate-500">
            <span>Don't have an account?</span>
            <a href="{{ url_for('signup') }}" class="font-bold text-sky-600 hover:text-sky-700 ml-1 transition hover:underline">
                Create Account
            </a>
        </div>

    </div>

    <!-- Toggle Password Visibility Script -->
    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
            } else {
                pwd.type = 'password';
            }
        }

        function handleGoogleOAuth(e) {
            const emailInput = document.getElementById('email');
            const emailVal = emailInput ? emailInput.value.trim() : '';
            if (emailVal && emailVal.includes('@')) {
                e.preventDefault();
                window.location.href = "{{ url_for('google_login') }}?login_hint=" + encodeURIComponent(emailVal);
            }
        }
    </script>

</body>
</html>
