<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>College Predictor - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef6ff,
                    #f8fbff
                );

        }

        .login-container {

            width: 430px;

            padding: 55px 50px;

            background: white;

            border-radius: 24px;

            box-shadow:
                0 20px 50px
                rgba(0, 80, 160, 0.12);

            text-align: center;

        }

        .logo {

            width: 72px;

            height: 72px;

            margin: 0 auto 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #4285f4,
                    #34a853
                );

            color: white;

            font-size: 34px;

        }

        h1 {

            color: #1265d8;

            font-size: 32px;

            font-weight: 800;

            margin-bottom: 10px;

        }

        .subtitle {

            color: #667085;

            font-size: 16px;

            margin-bottom: 35px;

        }

        .google-button {

            width: 100%;

            height: 55px;

            border: 1px solid #dadce0;

            border-radius: 10px;

            background: white;

            color: #3c4043;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            text-decoration: none;

            transition: 0.2s;

        }

        .google-button:hover {

            background: #f8f9fa;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.12);

        }

        .google-icon {

            width: 22px;

            height: 22px;

        }

        .error {

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #fff1f1;

            color: #c62828;

            font-size: 14px;

        }

        .secure {

            margin-top: 28px;

            color: #7a869a;

            font-size: 13px;

            line-height: 1.5;

        }

        .google-note {

            margin-top: 18px;

            color: #667085;

            font-size: 12px;

            line-height: 1.5;

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🎓
    </div>


    <h1>
        COLLEGE PREDICTOR
    </h1>


    <p class="subtitle">
        Sign in to predict your best colleges
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <a
        href="{{ url_for('google_login') }}"
        class="google-button"
    >

        <svg
            class="google-icon"
            viewBox="0 0 24 24"
        >

            <path
                fill="#4285F4"
                d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.92-4.18 2.92-7.42z"
            />

            <path
                fill="#34A853"
                d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.5z"
            />

            <path
                fill="#FBBC05"
                d="M6.54 13.58A5.86 5.86 0 0 1 6.23 12c0-.55.1-1.08.31-1.58V7.89H3.3A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.11l3.24-2.53z"
            />

            <path
                fill="#EA4335"
                d="M12 6.39c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.39 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.7 5.39l3.24 2.53C7.31 8.11 9.46 6.39 12 6.39z"
            />

        </svg>


        Continue with Google

    </a>


    <p class="google-note">

        You will be securely redirected to Google
        to sign in with your Google account.

    </p>


    <p class="secure">

        🔒 Secure Google authentication

    </p>
</div>
</body>
</html>
