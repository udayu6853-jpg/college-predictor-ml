<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - EduPredict</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        skyCanvas: '#F0F7FE',
                        skyPrimary: '#0284C7',
                        skyAccent: '#0EA5E9',
                        skyTint: '#E0F2FE',
                        skyBorder: '#BAE6FD',
                        navyText: '#0F172A'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-dark-saas.css') }}">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F0F7FE;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(14, 165, 233, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 25%, rgba(2, 132, 199, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(56, 189, 248, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-800 antialiased">

    <!-- Ambient glowing halos -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-sky-400/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-cyan-400/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Verification Card -->
    <div class="w-full max-w-md bg-white rounded-3xl border border-sky-100 shadow-xl shadow-sky-500/10 p-8 sm:p-10 text-center relative z-10 space-y-6">
        
        <!-- Icon -->
        <div class="w-16 h-16 rounded-2xl bg-sky-50 text-sky-600 border border-sky-200 flex items-center justify-center mx-auto text-2xl shadow-xs">
            ✉️
        </div>

        <div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Verify Your Email</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-2">
                We sent a 6-digit confirmation code to:
                <strong class="text-slate-800 block mt-1 break-all">{{ email }}</strong>
            </p>
        </div>

        {% if error %}
        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold text-left flex items-start gap-2.5">
            <svg class="w-4 h-4 text-rose-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- OTP Form -->
        <form method="POST" action="{{ url_for('verify_otp') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="email" value="{{ email }}">

            <div>
                <label for="otp" class="block text-xs font-bold text-slate-700 mb-1.5 text-left">Verification Code</label>
                <input
                    type="text"
                    id="otp"
                    name="otp"
                    placeholder="000000"
                    maxlength="6"
                    minlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-sky-200 bg-sky-50/20 text-slate-900 text-center tracking-[10px] text-2xl font-black focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition"
                >
            </div>

            <button
                type="submit"
                class="w-full py-3 px-5 rounded-xl bg-gradient-to-r from-sky-600 to-sky-500 hover:from-sky-700 hover:to-sky-600 text-white font-extrabold text-sm shadow-md shadow-sky-600/25 active:scale-95 transition cursor-pointer"
            >
                Confirm & Access Dashboard
            </button>
        </form>

        <div class="pt-2">
            <a href="{{ url_for('signup') }}" class="text-xs font-bold text-sky-600 hover:text-sky-700 hover:underline">
                ← Back to Sign Up
            </a>
        </div>

    </div>

</body>
</html>
